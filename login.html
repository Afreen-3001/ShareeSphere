{% extends "base.html" %}
{% block title %}Log In — ShareSphere{% endblock %}

{% block content %}
<div class="form-wrap">
  <h2>Welcome back</h2>

  <form method="POST" action="{{ url_for('login') }}" class="form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required placeholder="Your password">

    <button type="submit" class="btn-solid full">Log In</button>
  </form>

  <p class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
